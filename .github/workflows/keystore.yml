# zipapkbuilder-workflow: 2
name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        required: true
        default: 'release'
      password:
        description: 'Keystore password'
        required: true
      validity_days:
        description: 'Validity in days'
        required: false
        default: '10950'
      pat_token:
        description: 'GitHub PAT (only used to save the secrets; the app deletes this run afterwards)'
        required: true

jobs:
  keygen:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore and save it as repository secrets
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          # The dispatch inputs are read from the event file on purpose. Writing an input straight
          # into this script with a workflow expression would print it in clear text in the log
          # header of this step, and a password containing quotes or a dollar sign could break out
          # of the shell quoting. Reading it here and masking it right away avoids both.
          GH_TOKEN=$(jq -r '.inputs.pat_token' "$GITHUB_EVENT_PATH")
          PASS=$(jq -r '.inputs.password' "$GITHUB_EVENT_PATH")
          ALIAS=$(jq -r '.inputs.alias' "$GITHUB_EVENT_PATH")
          DAYS=$(jq -r '.inputs.validity_days // "10950"' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$GH_TOKEN"
          echo "::add-mask::$PASS"

          if [ "${#PASS}" -lt 6 ]; then
            echo "::error::The keystore password must be at least 6 characters."
            exit 1
          fi
          case "$DAYS" in ''|*[!0-9]*) DAYS=10950 ;; esac

          STORE_NAME="keystore_$(date +%Y%m%d%H%M%S).jks"
          keytool -genkeypair \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$DAYS" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Android Debug, O=Android, C=US" \
            -storetype JKS \
            -keystore "$STORE_NAME"
          B64=$(base64 -w0 "$STORE_NAME")
          echo "Generated: $STORE_NAME"

          # GitHub wants secrets encrypted with libsodium's sealed box (PyNaCl).
          pip install --quiet pynacl || pip install --quiet --break-system-packages pynacl

          KEY_JSON=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$OWNER/$REPO/actions/secrets/public-key")
          KEY_ID=$(printf '%s' "$KEY_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["key_id"])')
          PUB_KEY=$(printf '%s' "$KEY_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["key"])')

          set_secret() {
            local name="$1" value="$2" encrypted
            encrypted=$(PYPUBKEY="$PUB_KEY" PYVAL="$value" python3 -c 'import os,base64; from nacl.public import SealedBox,PublicKey; pk=base64.b64decode(os.environ["PYPUBKEY"]); s=SealedBox(PublicKey(pk)).encrypt(os.environ["PYVAL"].encode()); print(base64.b64encode(s).decode())')
            curl --fail-with-body -sS -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$OWNER/$REPO/actions/secrets/$name" \
              -d "{\"encrypted_value\":\"$encrypted\",\"key_id\":\"$KEY_ID\"}" > /dev/null
            echo "Secret $name saved"
          }

          # The token itself is deliberately NOT saved as a secret: it is only needed here, to call
          # the secrets API. A stored copy would stay usable by every later run in this repository.
          set_secret KEYSTORE_BASE64 "$B64"
          set_secret STORE_PASSWORD  "$PASS"
          set_secret KEY_PASSWORD    "$PASS"
          set_secret KEY_ALIAS       "$ALIAS"
          set_secret KEYSTORE_FILE   "$STORE_NAME"

          VAR_BODY="{\"name\":\"KEYSTORE_FILENAME\",\"value\":\"$STORE_NAME\"}"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$OWNER/$REPO/actions/variables/KEYSTORE_FILENAME" \
            -d "$VAR_BODY")
          if [ "$CODE" != "204" ]; then
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$OWNER/$REPO/actions/variables" \
              -d "$VAR_BODY" > /dev/null
          fi
          echo "Variable KEYSTORE_FILENAME=$STORE_NAME saved"

          {
            echo "## Keystore Generated"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Filename | $STORE_NAME |"
            echo "| Secrets saved | KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS, KEYSTORE_FILE |"
            echo "| Variable saved | KEYSTORE_FILENAME |"
          } >> "$GITHUB_STEP_SUMMARY"